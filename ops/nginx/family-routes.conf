limit_req_zone $binary_remote_addr zone=family_routes_api:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 256k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"family-friendly-routes"}\n';
    }

    location = /parser/health {
        proxy_pass http://127.0.0.1:8081/health;
        include proxy_params;
        proxy_read_timeout 5s;
    }

    location = /model/health {
        proxy_pass http://127.0.0.1:8082/health;
        include proxy_params;
        proxy_read_timeout 5s;
    }

    location = /routing/status {
        proxy_pass http://127.0.0.1:8002/status;
        include proxy_params;
        proxy_read_timeout 5s;
    }

    location = /api/v1/rankings {
        limit_req zone=family_routes_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082/internal/v1/rankings;
        include proxy_params;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_connect_timeout 3s;
        proxy_read_timeout 80s;
    }
}
