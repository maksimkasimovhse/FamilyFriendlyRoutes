name: family-friendly-routes
services:
  parser-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/parser_service/Dockerfile
    environment:
      SOURCE_REGISTRY_PATH: /app/config/source_registry.json
      ML_API_TOKEN: ${ML_API_TOKEN:-}
      ML_REQUIRE_LEGACY_AUTH: ${ML_REQUIRE_LEGACY_AUTH:-false}
      ASSISTANT_RULES_FALLBACK: ${ASSISTANT_RULES_FALLBACK:-true}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_ACCESS_TOKEN: ${GIGACHAT_ACCESS_TOKEN:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_B2B}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Pro}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://api.giga.chat}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  model-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/model_service/Dockerfile
    environment:
      MODEL_CATALOG_VERSION: city-enriched-v3
      ML_API_TOKEN: ${ML_API_TOKEN:-}
      ML_REQUIRE_LEGACY_AUTH: ${ML_REQUIRE_LEGACY_AUTH:-false}
    ports:
      - "127.0.0.1:8082:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:693617873d42f24d9023eaa9aa002dccd832c9629c9ce8b60eb4ff30547215e1
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - valhalla-data:/custom_files
      - type: bind
        source: ./data/routing/nizhny-novgorod.osm.pbf
        target: /custom_files/nizhny-novgorod.osm.pbf
        read_only: true
        bind:
          create_host_path: false
    environment:
      server_threads: "2"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      build_transit: "False"
      use_default_speeds_config: "False"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      serve_tiles: "True"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 900s
    restart: unless-stopped
  postgres:
    build: ./infra/postgres
    image: family-friendly-routes/postgres:16
    environment:
      POSTGRES_DB: familyroutes
      POSTGRES_USER: familyroutes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyroutes -d familyroutes"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  migrate:
    build: ./infra/goose
    image: family-friendly-routes/goose:3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://familyroutes:${POSTGRES_PASSWORD:-}@postgres:5432/familyroutes?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["up"]

  # Обычная сеть Compose: контейнеры доступны друг другу по именам сервисов.
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://familyroutes:${POSTGRES_PASSWORD:-}@postgres:5432/familyroutes?sslmode=disable}
      ML_API_TOKEN: ${ML_API_TOKEN:-}
      ASSISTANT_URL: http://parser-service:8080/internal/v1/assistant-intents
      INITIAL_LLM_ENABLED: "true"
      LEGACY_ML_URL: http://mock-api:8090/internal/v1/recommendations
      CITY_ML_URL: http://model-service:8080/internal/v1/recommendations
    # Места для маршрута берёт у ML по контракту /internal/v1/recommendations.
    # New trips use ML; stored trips retain their original catalog provider.
    command: ["-listen", "0.0.0.0:8080", "-allow-network-listen", "-trust-proxy-headers", "-routing-url", "http://valhalla:8002", "-ml-url", "http://model-service:8080/internal/v1/recommendations", "-catalog-version", "city-enriched-v3", "-parser-url", "http://parser-service:8080", "-model-url", "http://model-service:8080"]
    volumes:
      - ./data:/app/data
      # Картинки карточек: backend отдаёт их под /media/ и без папки не стартует (-images-dir)
      - ./assets/images:/app/assets/images:ro
    depends_on:
      valhalla:
        condition: service_healthy
      mock-api:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  infra-import:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://familyroutes:${POSTGRES_PASSWORD:-}@postgres:5432/familyroutes?sslmode=disable}
    entrypoint: ["/usr/local/bin/infraload"]
    volumes:
      - ./data/infrastructure:/app/data/infrastructure:ro
    depends_on:
      postgres:
        condition: service_healthy

  # МОК рекомендаций ML. Инфраструктура карты читается Go-бэкендом из PostgreSQL.
  mock-api:
    build: ./infra/mock-api
    environment:
      MOCK_API_LISTEN: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  # Фронтенд (обычные HTML/CSS/JS из ./frontend) + прокси /api на бекенд.
  # Открывать: http://localhost:8000
  web:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/v1/reference-data"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./assets/images:/usr/share/nginx/card-images:ro
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Temporary public HTTPS URL; no phone certificate or Cloudflare account needed.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--region", "us", "--edge-ip-version", "4", "--url", "http://web:8001"]
    depends_on:
      - web
      - backend
    restart: unless-stopped

  # Optional trusted local HTTPS for a phone on the same Wi-Fi.
  caddy:
    image: caddy:2
    profiles: ["https"]
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_CERT_PORT:-8088}:80"
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  valhalla-data:
  pg-data:
