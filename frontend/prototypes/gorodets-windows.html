<style>
  :root { --ink:#0F1628; --ink-2:#5A6478; --now:#2463D6; --sepia:#8A5A2B; --bg:#F3F6FA; --kid:#E8641F; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Nunito,system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:16px; background:#fff; border-bottom:1px solid #e6eaf0; }
  h1 { margin:0 0 4px; font-size:24px; }
  header p { margin:0; color:var(--ink-2); font-size:14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .bar button { border:0; border-radius:999px; padding:8px 14px; min-height:40px; font:700 14px Nunito,sans-serif; background:var(--bg); cursor:pointer; }
  .bar button.on { background:var(--now); color:#fff; }
  .bar .export { background:var(--ink); color:#fff; margin-left:auto; }
  main { display:grid; grid-template-columns: 1fr 1fr; height: calc(100dvh - 130px); }
  #map { height:100%; }
  .list { overflow:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; align-content:start; grid-auto-rows:max-content; }
  .card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); cursor:pointer; border:3px solid transparent; }
  .card.hi { border-color:var(--now); }
  .card.pick { border-color:var(--kid); }
  .card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#ddd; }
  .card div { padding:8px 10px; font-size:13px; }
  .card b { display:block; font-size:14px; }
  .card small { color:var(--ink-2); }
  .card label { display:flex; gap:6px; align-items:center; margin-top:6px; font-weight:700; color:var(--kid); }
  .pin { width:14px; height:14px; border-radius:50%; background:var(--sepia); border:2px solid #fff; position:relative; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin.pick { background:var(--kid); width:18px; height:18px; }
  .pin.hi { background:var(--now); }
  .pin i { position:absolute; left:50%; bottom:50%; width:2px; height:22px; background:inherit; transform-origin:bottom center; margin-left:-1px; }
  @media (max-width: 760px) { main { grid-template-columns:1fr; grid-template-rows: 45dvh auto; height:auto; } .list { overflow:visible; } }
</style>

ir": "n", "lat": 56.645294, "lon": 43.464299, "title": "Улица Максима Горького, базар", "file": "z/j/7/zj75ooqjd1adtv6nca.jpg", "d": 744}, {"cid": 1643825, "year": 1955, "dir": "s", "lat": 56.645409, "lon": 43.464233, "title": "Улица Максима Горького, базар", "file": "b/0/l/b0lq84kbla584evcu2.jpg", "d": 745}, {"cid": 1643046, "year": 1955, "dir": "sw", "lat": 56.642713, "lon": 43.464651, "title": "Вид на Волгу", "file": "v/9/s/v9s86345jeki7mqq11.jpg", "d": 851}, {"cid": 1643050, "year": 1955, "dir": "nw", "lat": 56.640604, "lon": 43.464899, "title": "Пристань", "file": "j/r/m/jrmdktbptww4u9ymh5.jpg", "d": 995}, {"cid": 1643149, "year": 1955, "dir": "e", "lat": 56.645497, "lon": 43.458916, "title": "Вид с Волги", "file": "r/n/8/rn8unvs1t0wkpxf69l.jpg", "d": 1060}, {"cid": 2484452, "year": 1955, "dir": "nw", "lat": 56.644683, "lon": 43.471365, "title": "Улица Кирова", "file": "r/m/k/rmk8rq0em525hpiwbu.png", "d": 394}, {"cid": 1643596, "year": 1955, "dir": "se", "lat": 56.646355, "lon": 43.464411, "title": "Улица Максима Горького, базар", "file": "j/k/s/jksicg4ie43ld2jstn.jpg", "d": 714}, {"cid": 1643599, "year": 1955, "dir": "n", "lat": 56.645972, "lon": 43.464485, "title": "Улица Максима Горького, базар", "file": "l/u/r/lurovv9tresiiqlqx6.jpg", "d": 716}, {"cid": 1643594, "year": 1955, "dir": "s", "lat": 56.646046, "lon": 43.464398, "title": "Улица Максима Горького, базар", "file": "m/h/z/mhzrf07apeqdksir6g.jpg", "d": 720}];
const DIR = { n:0, ne:45, e:90, se:135, s:180, sw:225, w:270, nw:315 };
const ERAS = [['Все',0,9999],['до 1900',0,1899],['1900–1917',1900,1917],['1918–1940',1918,1940],['1941–1955',1941,1955]];
let era = 0, onlyPicked = false;
let picked = new Set();
try { picked = new Set(JSON.parse(localStorage.getItem('gorodets-picked') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('gorodets-picked', JSON.stringify([...picked])); } catch (e) {} };

const map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/positron', center:[43.4705,56.6445], zoom:14.6 });
const markers = new Map();
for (const p of PHOTOS) {
  const el = document.createElement('div'); el.className = 'pin';
  const arrow = document.createElement('i'); arrow.style.transform = 'rotate(' + DIR[p.dir] + 'deg)'; el.append(arrow);
  el.title = p.year + ' · ' + p.title;
  el.onclick = () => focus(p.cid, true);
  markers.set(p.cid, { m: new maplibregl.Marker({ element: el, rotationAlignment: 'map' }).setLngLat([p.lon, p.lat]).addTo(map), el });
}

function focus(cid, scroll) {
  document.querySelectorAll('.card.hi').forEach(c => c.classList.remove('hi'));
  markers.forEach(x => x.el.classList.remove('hi'));
  const card = document.getElementById('c' + cid);
  if (card) { card.classList.add('hi'); if (scroll) card.scrollIntoView({ behavior:'smooth', block:'center' }); }
  const mk = markers.get(cid); mk.el.classList.add('hi');
  if (!scroll) map.easeTo({ center: mk.m.getLngLat(), zoom: Math.max(map.getZoom(), 16) });
}

function render() {
  const [, from, to] = ERAS[era];
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const p of PHOTOS) {
    const show = p.year >= from && p.year <= to && (!onlyPicked || picked.has(p.cid));
    const mk = markers.get(p.cid);
    mk.el.style.display = show ? '' : 'none';
    mk.el.classList.toggle('pick', picked.has(p.cid));
    if (!show) continue;
    const card = document.createElement('div');
    card.className = 'card' + (picked.has(p.cid) ? ' pick' : ''); card.id = 'c' + p.cid;
    card.innerHTML = '<img loading="lazy" alt="" src="https://img.pastvu.com/h/' + p.file + '">' +
      '<div><b></b><small></small><label><input type="checkbox"> в окна</label></div>';
    card.querySelector('b').textContent = p.title;
    card.querySelector('small').textContent = p.year + ' · смотрит на ' + p.dir.toUpperCase() + ' · ' + p.d + ' м от центра · ';
    const a = document.createElement('a'); a.href = 'https://pastvu.com/p/' + p.cid; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'PastVu';
    card.querySelector('small').append(a);
    const cb = card.querySelector('input'); cb.checked = picked.has(p.cid);
    cb.onclick = e => { e.stopPropagation(); cb.checked ? picked.add(p.cid) : picked.delete(p.cid); save(); render(); };
    card.onclick = () => focus(p.cid, false);
    list.append(card);
  }
}

const bar = document.getElementById('bar');
ERAS.forEach(([name], i) => {
  const b = document.createElement('button'); b.textContent = name; b.className = i === era ? 'on' : '';
  b.onclick = () => { era = i; [...bar.querySelectorAll('.era')].forEach((x, k) => x.classList.toggle('on', k === i)); render(); };
  b.classList.add('era'); bar.append(b);
});
const pk = document.createElement('button'); pk.textContent = 'Только отмеченные';
pk.onclick = () => { onlyPicked = !onlyPicked; pk.classList.toggle('on', onlyPicked); render(); }; bar.append(pk);
const ex = document.createElement('button'); ex.className = 'export'; ex.textContent = 'Скопировать выбранные';
ex.onclick = async () => {
  const sel = PHOTOS.filter(p => picked.has(p.cid)).map(p => ({ cid: p.cid, title: p.title, year: p.year, dir: p.dir, point: [p.lon, p.lat], url: 'https://pastvu.com/p/' + p.cid }));
  const text = JSON.stringify(sel, null, 2);
  try { await navigator.clipboard.writeText(text); ex.textContent = 'Скопировано: ' + sel.length; } catch (e) { prompt('Скопируйте:', text); }
  setTimeout(() => { ex.textContent = 'Скопировать выбранные'; }, 2000);
};
bar.append(ex);
render();
</script>
