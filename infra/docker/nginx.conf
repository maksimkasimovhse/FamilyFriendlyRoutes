# Фронт и /api на одном адресе (бекенду нужен один origin для cookie и CSRF).
server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;
    set $backend_proto http;

    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host — с портом: бекенд сверяет Origin с Host для защиты от CSRF
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $backend_proto;
        proxy_read_timeout 60s;
    }

    # Картинки карточек: те же ссылки /media/ab/cd/<sha256>_<размер>.webp, что отдаёт backend,
    # но из примонтированного assets/images — backend для просмотра карточек не нужен.
    location ~ "^/media/([0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{64}_(?:thumb|card|full)\.webp)$" {
        alias /usr/share/nginx/card-images/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}

# Internal HTTPS ingress, reached only by Caddy; port 8001 is not published.
# Фронт и /api на одном адресе (бекенду нужен один origin для cookie и CSRF).
